<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biweekly Activity Report</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- MSAL Browser (provides createNestablePublicClientApplication for NAA) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>

  <link rel="stylesheet" href="taskpane.css?v=10" />
</head>
<body>
  <header class="app-head">
    <h1>Biweekly Activity Report</h1>
    <p class="sub">Your meetings and sent email, turned into a timesheet diary.</p>
  </header>
  <!-- Certification 1100.5.7.1: a visible way out wherever there is a way in. -->
  <div id="authRow" class="auth-row">
    <span id="authWho">Not signed in</span>
    <button id="signOut" class="linkish" type="button" hidden>Sign out</button>
  </div>

  <section class="controls">
    <button id="generate" class="primary">Generate report</button>
    <details id="options" class="options" open>
      <summary>Options</summary>
      <div class="row">
        <label>Days back
          <input id="daysBack" type="number" min="1" max="60" value="14" />
        </label>
        <label>Hours mode
          <select id="mode">
            <option value="standard">Standard day</option>
            <option value="span">Activity span</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Standard day (h)
          <input id="standardDay" type="number" min="0" max="24" step="0.5" value="8" />
        </label>
        <label>Max day (h)
          <input id="maxDay" type="number" min="0" max="24" step="0.5" value="11" />
        </label>
      </div>
      <div class="row">
        <label>Work start <input id="workStart" type="time" value="08:00" /></label>
        <label>Work end <input id="workEnd" type="time" value="16:30" /></label>
      </div>
      <label class="check"><input id="countReceived" type="checkbox" checked /> Count days I only received email as worked</label>
      <label class="check"><input id="listReceived" type="checkbox" checked /> List received email subjects (reading is work too)</label>
      <div class="proj">
        <div class="proj-h">\ud83d\udccc Project / grant filter (for billing &amp; in-kind reporting)</div>
        <label>Project name (label on the report)
          <input id="projectName" type="text" placeholder="TPF-5(372) BIM pooled fund" />
        </label>
        <label>Keywords (comma separated \u2014 matched in subjects &amp; names)
          <input id="projectKeywords" type="text" placeholder="BIM, pooled fund, TPF-5" />
        </label>
        <label class="check"><input id="projectOnly" type="checkbox" /> Report ONLY project activity (billing evidence mode)</label>
        <div class="row">
          <label>Min/sent email
            <input id="sentEmailMin" type="number" min="0" max="60" value="5" />
          </label>
          <label>Min/received email
            <input id="recvEmailMin" type="number" min="0" max="60" value="2" />
          </label>
        </div>
      </div>
    </details>
  </section>

  <section id="status" class="status" hidden></section>

  <section id="output" class="output" hidden>
    <div class="actions">
      <button id="copy">Copy</button>
      <button id="copyText">Copy as text</button>
      <button id="draft" class="primary">Save to Drafts</button>
    </div>
    <div id="preview"></div>
  </section>

  <!-- Load logic in order: data layer, pure report builder, then UI wiring.
       ?v= cache-buster — bump on each deploy so the Outlook webview fetches fresh JS. -->
  <script src="../graph.js?v=10"></script>
  <script src="../report.js?v=10"></script>
  <script src="taskpane.js?v=10"></script>
</body>
</html>
